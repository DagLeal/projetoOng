{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="conteudo" style="text-align: center;">
    <section class="doc-main">
        <h1>Documentação</h1>

        <select id="documentoSelect" onchange="mostrarImagem()">
            <option value="">Selecione um documento</option>
            {% for doc in documentos %}
                <option value="{{ doc.imagem.url }}" {% if doc.id == ultimo_documento.id %}selected{% endif %}>
                    {{ doc.titulo }}
                </option>
            {% endfor %}
        </select>

        <div id="documentoSelecionado">
            {% if ultimo_documento %}
                <img id="imagemSelecionada" src="{{ ultimo_documento.imagem.url }}" alt="Documento" style="max-width: 90%; height: auto;">
            {% else %}
                <img id="imagemSelecionada" style="display: none; max-width: 90%; height: auto;">
            {% endif %}
        </div>
    </section>
</div>

<script src="{% static 'js/script.js' %}"></script>
{% endblock %}
