{% extends "base.html" %}
{% load static %}

{% block content %}
<main>
  <section style="display: flex; flex-direction: column; align-items: center; gap: 2rem; padding: 2rem;">
    <h1 style="color: #00B35F;">Documentação</h1>

    <select id="documentoSelect" style="padding: 10px; font-size: 16px; width: 80%; max-width: 500px;">
        <option value="">-- Selecione um documento --</option>
        {% for doc in documentos %}
            <option value="{{ doc.imagem.url }}">{{ doc.titulo }}</option>
        {% endfor %}
    </select>

    <div class="imagem-documento" style="margin-top: 2rem;">
        <img id="imagemSelecionada" src="" alt="Documento selecionado" style="max-width: 90%; display: none; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    </div>
  </section>
</main>

<script src="{% static 'js/script.js' %}"></script>
{% endblock %}
