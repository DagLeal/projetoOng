{% extends 'base.html' %}
{% load static %}

{% block title %}CADON | Home{% endblock %}
{% block content %}


<h2>Siga-nos no Instagram</h2>
<div id="instafeed" class="instagram-feed"></div>

<!-- CARROSSEL do HOME -->

<h2>Exemplo de carrossel</h2>
<div class="slideshow-container">

  <div class="mySlides fade">
    <div class="numbertext">1 / 3</div>
<img src="{% static 'img/img1.jpg' %}" alt="img1" style="width:100%" height="500px">
    <div class="text">Legenda 1</div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">2 / 3</div>
    <img src="{% static 'img/img2.png' %}" alt="img2" style="width:100%" height="500px">
    <div class="text">Legenda 2</div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">3 / 3</div>
   <img src="{% static 'img/img3.jpg' %}" alt="img3" style="width:100%" height="500px">
    <div class="text">Legenda 3</div>
  </div>

  <!-- Next and previous buttons -->
  <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
  <a class="next" onclick="plusSlides(1)">&#10095;</a>
</div>
<br>

<div style="text-align:center">
  <span class="dot" onclick="currentSlide(1)"></span>
  <span class="dot" onclick="currentSlide(2)"></span>
  <span class="dot" onclick="currentSlide(3)"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/instafeed.js@1.4.1"></script>

<script>
    var feed = new Instafeed({
        accessToken: 'IGQVJ...SEU_TOKEN_AQUI...',  // ⚠️ Coloque aqui o token de acesso
        limit: 8,
        template: '<a href="{{link}}" target="_blank"><img src="{{image}}" /></a>'
    });
    feed.run();
</script>


{% endblock %}
