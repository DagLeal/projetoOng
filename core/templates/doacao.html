{% extends 'base.html' %}

{% block title %}Doação{% endblock %}
{% load static %}

{% block content %}

<div class="container-doacao">
    <form id="form-doacao" class="form-doacao">
      <h2>Faça sua doação</h2>

      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" required />

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required />

      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" required maxlength="14" placeholder="000.000.000-00"/>

      <label for="valor">Valor da doação (R$):</label>
      <input type="number" id="valor" name="valor" required min="0.01" step="0.01" />

      <button type="submit">Gerar QR Code</button>
    </form>

    <div class="qr-code-area" id="qr-container" style="display: none;">
      <h2>Escaneie o QR Code</h2>
      <img id="qr-image" src="" alt="QR Code Pix" />
    </div>
  </div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/scriptnode.js' %}"></script>
{% endblock %}
