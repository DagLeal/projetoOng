{% extends "base.html" %}

{% block title %}CADON - Doação{% endblock %}

{% block content %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Gerar QR Code</button>
</form>

{% if qr_code %}
  <h3>Escaneie para doar:</h3>
  <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code">
{% endif %}

{% if codigo_pix %}
  <h3>Ou copie o código PIX:</h3>
  <textarea readonly style="width:100%; height:80px;">{{ codigo_pix }}</textarea>
{% endif %}
{% endblock %}
