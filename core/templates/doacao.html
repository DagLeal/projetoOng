{% extends 'base.html' %}

{% block title %}Doação{% endblock %}

{% block content %}

<h1>Faça sua doação</h1>

<div style="display: flex; gap: 50px;">
    <div style="flex: 1;">
        <form method="POST">
            {% csrf_token %}
            <label>Nome:</label><br>
            <input type="text" name="nome"><br><br>

            <label>Email:</label><br>
            <input type="email" name="email"><br><br>

            <label>CPF:</label><br>
            <input type="text" name="cpf"><br><br>

            <label>Valor (R$):</label><br>
            <input type="number" name="valor" step="0.01"><br><br>

            <button type="submit">Gerar QR Code</button>
        </form>
    </div>

    {% if qr_code %}
    <div style="flex: 1;">
        <h2>QR Code para pagamento</h2>
        <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code Pix" style="width: 300px; height: 300px;">
        <p>Nome: {{ nome }}</p>
        <p>Valor: R$ {{ valor_doado }}</p>
        <p>Pix Copia e Cola:</p>
        <textarea readonly style="width:100%;height:80px;">{{ pix_code }}</textarea>
    </div>
    {% endif %}
</div>

{% endblock %}
